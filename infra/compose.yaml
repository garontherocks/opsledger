services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: opsledger
      POSTGRES_USER: opsledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U opsledger -d opsledger"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
