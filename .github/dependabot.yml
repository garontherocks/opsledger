version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /lab/phase0
    schedule:
      interval: monthly
    groups:
      # One monthly PR for every compatible (minor/patch) update.
      # Major updates arrive as individual PRs so breaking changes get reviewed.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0", so a
      # TypeScript major breaks `npm ci`. Remove once typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Pinned on purpose to keep M2 eval evidence reproducible (ADR 0019).
      - dependency-name: 'promptfoo'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    ignore:
      # package.json engines pins Node ">=24.19.0 <25"; move the image major with it.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
