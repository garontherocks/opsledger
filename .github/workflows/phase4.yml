name: M2 deterministic product and AI boundaries
on: [push, pull_request]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [api, browser]
    env:
      TEST_DATABASE_URL: postgresql://opsledger:disposable-ci-only@127.0.0.1:5432/opsledger_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build pinned PostgreSQL 18.6 with pgvector 0.8.7
        run: |
          docker build -f infra/Dockerfile.db -t opsledger-ci-db .
          docker run -d --name opsledger-ci-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=opsledger -e POSTGRES_PASSWORD=disposable-ci-only -e POSTGRES_DB=opsledger_test opsledger-ci-db
          for attempt in $(seq 1 30); do docker exec opsledger-ci-db pg_isready -h 127.0.0.1 -U opsledger -d opsledger_test && break; sleep 1; done
          docker exec opsledger-ci-db pg_isready -h 127.0.0.1 -U opsledger -d opsledger_test
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run typecheck && npm run build
      - run: npm run test:unit
      - run: npm run m4:context-test
      - run: npm audit --audit-level=moderate
      - if: matrix.lane == 'api'
        name: Native lifecycle lock-overlap regression
        run: node --experimental-strip-types --test tests/lifecycle-outbox.integration.test.ts
      - if: matrix.lane == 'api'
        name: Native QA state and independent process recovery
        run: npm run m4:state-test
      - if: matrix.lane == 'api'
        run: npm run m3:test
      - if: matrix.lane == 'api'
        run: npm run mcp:test
      - if: matrix.lane == 'api'
        run: npm run agent:eval
      - if: matrix.lane == 'api'
        run: npm run ai:regression
      - if: matrix.lane == 'api'
        run: env -u TEST_DATABASE_URL M2_BUNDLE_FIXTURE=true npm run ai:m2-harness
      - if: matrix.lane == 'api'
        run: npm run test:integration | tee evidence/phase10-ci-integration.log
      - if: matrix.lane == 'api'
        run: env -u TEST_DATABASE_URL npm run quality:baseline | tee evidence/phase10-ci-baseline.log
      - if: matrix.lane == 'browser'
        run: npx playwright install --with-deps chromium
      - if: matrix.lane == 'browser'
        name: Targeted lifecycle regression (five fresh server lifetimes, no retries)
        run: |
          for trial in 1 2 3 4 5; do
            E2E_FLOW=lifecycle npx playwright test tests/browser/lifecycle.spec.ts
            cp evidence/m3-lifecycle-diagnostic-0.json evidence/m3-lifecycle-diagnostic-trial-$trial.json
          done
      - if: matrix.lane == 'browser'
        run: npm run test:e2e | tee evidence/phase10-ci-e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase10-${{ matrix.lane }}-${{ github.sha }}
          path: |
            evidence/phase13-*
            evidence/m3-*
            evidence/phase14-*
            evidence/phase15-*
            evidence/phase16-*
            evidence/m4-*
            evidence/phase12-*
            evidence/phase11-*
            evidence/phase10-*
            evidence/phase9-*
            evidence/m2-*
            evidence/phase8-*
            evidence/phase7-*
            evidence/phase6-*
            evidence/phase5-*
            evidence/phase4-*
          retention-days: 7

  windows-launchers:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mcp:test
      - run: npm run m3:test

