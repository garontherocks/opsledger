name: Deterministic v1 acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [api, browser]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: opsledger
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: opsledger_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opsledger -d opsledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://opsledger:disposable-ci-only@127.0.0.1:5432/opsledger_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run typecheck && npm run build
      - run: npm run test:unit
      - run: npm audit --audit-level=moderate
      - if: matrix.lane == 'api'
        run: npm run test:integration | tee evidence/phase5-ci-integration.log
      - if: matrix.lane == 'api'
        run: env -u TEST_DATABASE_URL npm run quality:baseline | tee evidence/phase5-ci-baseline.log
      - if: matrix.lane == 'browser'
        run: npx playwright install --with-deps chromium
      - if: matrix.lane == 'browser'
        run: npm run test:e2e | tee evidence/phase5-ci-e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase5-${{ matrix.lane }}-${{ github.sha }}
          path: |
            evidence/phase5-*
            evidence/phase4-*
          retention-days: 7
