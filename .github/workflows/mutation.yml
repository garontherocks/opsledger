name: Mutation testing of the AI oracles
# Stryker mutates the agent gates, the structured-output parser and the trajectory evaluator, then runs their unit
# tests against every mutant (docs/mutation-testing.md). About 10 minutes, so it runs weekly and on demand, not per push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  stryker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts
      - run: npm run test:mutation
      - run: node --experimental-strip-types scripts/mutation-summary.ts --check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
